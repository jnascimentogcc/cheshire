  - { id: secure-file-transfer, name: "Secure file transfer", domain: integration, cross_cutting: false,
      description: "Delivering files to or from another party with confidentiality and integrity.", recognition: ["send the file", "partner", "SFTP"], status: validated }
  - { id: partner-identity, name: "External partner identity", domain: security, cross_cutting: false,
