  - { id: interface-contract-management, name: "Interface contract and schema management", domain: integration, cross_cutting: false,
      description: "Defining and versioning the shape of exchanged data.", recognition: ["format", "layout", "schema"], status: validated }

  # cross-cutting: recur across requirements
  - { id: audit-log, name: "Audit log", domain: security, cross_cutting: true,
      description: "Tamper-evident record of who did what and when.", recognition: ["audit", "who did"], status: validated }
  - { id: secrets-management, name: "Secrets and key management", domain: security, cross_cutting: true,
      description: "Storing and rotating credentials and keys.", recognition: ["credentials", "API key"], status: validated }
  - { id: job-monitoring, name: "Job monitoring and alerting", domain: operations, cross_cutting: true,
      description: "Knowing whether scheduled work ran and alerting if not.", recognition: ["did it run"], status: validated }
  - { id: failure-handling, name: "Failure handling, retries and idempotency", domain: integration, cross_cutting: true,
      description: "Retrying safely without duplicate effects; dead-letter handling.", recognition: ["retry", "failure", "twice"], status: validated }
