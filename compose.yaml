# Everything is published on 127.0.0.1 only; put a TLS reverse proxy in front for real use.
services:
  db:
    image: postgres:17
    env_file: .env
    environment:
      POSTGRES_USER: cheshire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cheshire
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${CHESHIRE_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheshire -d cheshire"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the numbered migrations as the owner role, then exits.
  migrate:
    build: .
    env_file: .env
    entrypoint: ["cheshire"]
    command: ["migrate-db"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${CHESHIRE_API_PORT:-8000}:8000"

  # The Angular app behind nginx (unprivileged); proxies /api to `api`, SSE unbuffered.
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:${CHESHIRE_WEB_PORT:-8080}:8080"

  cli:
    build: .
    env_file: .env
    profiles: ["tools"]
    entrypoint: ["cheshire"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
