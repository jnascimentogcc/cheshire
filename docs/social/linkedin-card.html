<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cheshire v0.2.0, LinkedIn card</title>
<style>
  :root { --bg:#ece5da; --card:#f7f4ed; --ink:#2b3140; --muted:#5d6472; --green:#4a5d54; --line:rgba(47,53,67,.16); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 627px; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  .wrap { display: grid; grid-template-columns: 560px 1fr; gap: 48px; height: 100%; padding: 56px 56px 0 64px; }
  .left { display: flex; flex-direction: column; padding-bottom: 48px; }
  .cat { font-family: Consolas, "Courier New", monospace; font-size: 26px; color: var(--green); letter-spacing: 1px; }
  h1 { font-size: 76px; line-height: 1; letter-spacing: -2px; margin-top: 10px; }
  .tag { font-size: 28px; line-height: 1.3; margin-top: 22px; color: var(--ink); }
  ul { list-style: none; padding: 0; margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
  li { font-size: 21px; color: var(--muted); display: flex; gap: 12px; align-items: baseline; }
  li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex: none; transform: translateY(-2px); }
  li b { color: var(--ink); font-weight: 600; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 14px; font-size: 19px; color: var(--muted); }
  .pill { background: var(--green); color: #fff; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 18px; }
  .shot { position: relative; margin-top: 8px; min-width: 0; }
  .frame { width: 100%; max-width: 100%; height: 540px; overflow: hidden; border-radius: 16px 16px 0 0; border: 1px solid var(--line);
    background: var(--card); box-shadow: 0 18px 40px rgba(31,37,50,.22); }
  .frame img { display: block; width: 1280px; transform: scale(.5); transform-origin: top left; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="cat">=^.^=</div>
      <h1>Cheshire</h1>
      <p class="tag">From a requirement to the building blocks it needs. The choice stays with you.</p>
      <ul>
        <li><span><b>Deterministic rules</b> decide, not an LLM</span></li>
        <li><span>The model <b>translates and explains</b>, grounded in a trace</span></li>
        <li><span><b>No rankings.</b> Gaps are results too</span></li>
      </ul>
      <div class="foot"><span class="pill">v0.2.0</span><span>Open source · github.com/jnascimentogcc/cheshire</span></div>
    </div>
    <div class="shot"><div class="frame"><img src="../images/consult-result.png" alt=""></div></div>
  </div>
</body>
</html>
