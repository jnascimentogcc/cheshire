# Serves the Angular app and proxies /api to the API container.
# Runs unprivileged on 8080; compose publishes it on 127.0.0.1 only. TLS is terminated
# by whatever reverse proxy the deployment puts in front (docs/tech-stack.md section 7).

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS; the upstream is resolved per request so nginx starts even if
  # the API container is still coming up.
  resolver 127.0.0.11 valid=10s;
  set $api_upstream http://api:8000;

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Server-sent events (analysis stages, first rationale): never buffer or cut them.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    client_max_body_size 1m;
  }

  # Not hashed: always revalidate.
  location = /theme-init.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Hashed bundles never change; the shell and the translations must stay fresh.
  location ~* \.(?:js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
